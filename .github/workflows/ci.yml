name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias (versiones y hashes fijos)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install aiosmtpd cryptography   # solo para las pruebas de SMTP real local
      - name: Pruebas
        run: python -m pytest -q

  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install pip-audit bandit
      - name: Vulnerabilidades conocidas en dependencias
        run: python -m pip_audit -r requirements.txt
      - name: Análisis estático (Bandit)
        run: python -m bandit -r app herramientas --severity-level medium
